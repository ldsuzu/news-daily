name: collect

# 海外采集分身：只抓墙外源，产出 bundle JSON 提交回仓库。
# 本地软件随后用 `newspipe sync` 把它拉回来（见技术框架.md §3）。

on:
  schedule:
    # UTC 22:30 = 北京 06:30。GitHub 的定时任务有几分钟到几十分钟的调度延迟，
    # 所以提前跑，给本地 07:00 的 sync 留足缓冲。
    - cron: '30 22 * * *'
  workflow_dispatch: {}        # 支持手动补跑

permissions:
  contents: write              # 需要提交 bundles/

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装
        run: pip install -e .

      - name: 抓取墙外源并产出 bundle
        run: newspipe collect --out bundles

      - name: 查看结果
        run: |
          echo "本次产出："
          ls -la bundles/ || true

      - name: 提交 bundle
        run: |
          git config user.name  "newspipe-bot"
          git config user.email "bot@users.noreply.github.com"
          git add bundles
          if git diff --staged --quiet; then
            echo "没有新内容，跳过提交"
          else
            git commit -m "bundle $(date -u +%F)"
            git push
          fi
