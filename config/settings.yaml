# 每日简报 · 全局设置
# 所有可调项都在这里，代码里不写死任何数字。

app:
  name: 每日简报

paths:
  data_dir: data          # 相对项目根目录
  db: data/news.db
  contents: data/contents # 正文缓存，按日期分目录
  bundles: data/bundles   # 本地留存的海外 bundle 副本（回退用）
  archive: archive        # 每日 Markdown 归档

schedule:
  daily_at: "07:00"         # 每天生成当日日报的时间
  incremental_hours: 2      # 白天增量抓热榜类源的间隔；0 = 关闭

# 条数：精选 / 全部 两层（见技术框架 §4.1）
selection:
  picks_per_domain: 10   # 精选每领域条数：按重要度取前 N 条，随你调
  picks_min_score: 0     # 精选的分数下界；0 = 不设下界（只按 Top N 取）。
                         # 想更严一点就填 8（那需要 LLM 打分接进来后才有意义）
  max_per_source: 3      # 精选里单个来源最多占几条。没有这个，一家就能把
                         # 10 个名额全占满（国内游戏站只有标题，关键词加分吃亏）

network:
  proxy: ""              # 例如 http://127.0.0.1:7890；留空 = 直连
  timeout_seconds: 20
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
  rate_limit_per_host: 1.0  # 每域名每秒最大请求数

# 海外采集分身：本地用哪个仓库把 bundle 拉回来（见技术框架 §3.4）
bundle:
  repo: "ldsuzu/news-daily"   # 形如 "用户名/仓库名"
  branch: main
  path: bundles
  token: ""              # 私有仓库才需要；也支持环境变量 NEWSPIPE_GH_TOKEN
  mirrors:
    - "https://cdn.jsdelivr.net/gh/{repo}@{branch}/{path}/{date}.json"
    - "https://api.github.com/repos/{repo}/contents/{path}/{date}.json"
    - "https://raw.githubusercontent.com/{repo}/{branch}/{path}/{date}.json"

# 可选：RSSHub 自建实例，用来给没有 RSS 的源兜底
rsshub:
  base: ""               # 例如 http://127.0.0.1:1200

llm:
  enabled: true             # 已启用；api_key 走环境变量 NEWSPIPE_LLM_KEY，不写进文件
  provider: deepseek
  model: deepseek-flash     # DeepSeek-V4.1-Flash；贵一点的备选 deepseek-v4-pro
  base_url: https://api.deepseek.com
  api_key: ""               # 也可用环境变量 NEWSPIPE_LLM_KEY，免得写进文件
  batch_size: 20            # 一次请求塞多少条 —— 批量是省 token 的主要手段
  max_items_per_run: 800    # 单轮最多处理多少条，防止一口气烧穿预算
  daily_budget_cny: 1.0     # 硬上限：当天花超过这个数就停手（0 = 不限）
  summary_chars: 400        # 每条送进去的摘要截断长度 —— 输入 token 的大头就在这
  # 单价（元 / 百万 token），只用来把消耗换算成人民币显示，不影响实际扣费。
  # 默认 = DeepSeek 空闲时段价格；高峰时段（工作日 9-12、14-18）是它的两倍。
  prices:
    input_miss: 1.00
    input_hit: 0.02
    output: 4.00

retention:
  keep_forever: true     # 历史永久保留，不做滚动过期
