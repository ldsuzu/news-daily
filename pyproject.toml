[project]
name = "newspipe"
version = "0.0.1"
description = "每日简报 — 本地新闻聚合与阅读软件（游戏 / AI）"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1"]
extract = ["trafilatura>=1.8"]
dev = ["pytest>=8"]

[project.scripts]
newspipe = "newspipe.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
newspipe = ["storage/*.sql"]
