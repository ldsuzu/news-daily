<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<title>每日简报 · 桌面版界面原型</title>
<!--
  PROTOTYPE — 用来讨论「桌面软件该长什么样」。
  三个结构不同的方向，?variant=A|B|C 切换；每个都能切到「设置」看那一屏。
  数据全是假的，不接后端。选完就丢。
-->
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --serif:Georgia,"Songti SC",serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
  --bg:#e8e8ea;--win:#fff;--win2:#f7f7f8;--side:#f2f2f4;--line:#e3e3e6;--line2:#d2d2d6;
  --fg:#1a1a1d;--fg2:#5c5c66;--fg3:#94949e;
  --brand:#5b4ee0;--brand2:#0b8ec9;--ok:#1f9254;--warn:#b0730a;--err:#c0392b;
  --sh:0 18px 50px rgba(0,0,0,.16),0 2px 8px rgba(0,0,0,.08);
}
html[data-theme=dark]{
  --bg:#141417;--win:#1c1c21;--win2:#232329;--side:#191920;--line:#2c2c34;--line2:#3a3a45;
  --fg:#ececf2;--fg2:#a4a4b2;--fg3:#6d6d7a;
  --brand:#8b7cf6;--brand2:#38bdf8;
  --sh:0 18px 50px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.3);
}
body{margin:0;background:var(--bg);font-family:var(--sans);color:var(--fg);font-size:13.5px;
  display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px 24px 96px;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit}

/* ── 模拟的桌面窗口 ── */
.win{width:1180px;max-width:100%;height:720px;background:var(--win);border-radius:11px;
  box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--line2)}
.titlebar{height:38px;background:var(--win2);border-bottom:1px solid var(--line);
  display:flex;align-items:center;padding:0 14px;gap:14px;flex:none;user-select:none}
.lights{display:flex;gap:7px}
.lights i{width:11px;height:11px;border-radius:50%;display:block}
.lights i:nth-child(1){background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.titlebar .t{font-size:12.5px;color:var(--fg2);font-weight:600;letter-spacing:.02em}
.titlebar .sp{flex:1}
.titlebar .hint{font-size:11px;color:var(--fg3);font-family:var(--mono)}
.body{flex:1;display:flex;min-height:0}

/* ── 通用小件 ── */
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;vertical-align:middle;margin-right:5px}
.dot.game{background:var(--brand)}.dot.ai{background:var(--brand2)}
.src{font-size:11.5px;color:var(--fg2);font-weight:600}
.time{font-family:var(--mono);font-size:11px;color:var(--fg3)}
.en{font-size:11.5px;color:var(--fg3);font-style:italic}
.score{font-family:var(--mono);font-size:10.5px;font-weight:700;padding:1px 5px;border-radius:5px;border:1px solid currentColor}
.score.hi{color:var(--err)}.score.mid{color:var(--warn)}.score.lo{color:var(--fg3)}
.tag{font-size:10px;padding:1px 6px;border-radius:20px;border:1px solid currentColor;color:var(--warn)}
.tag.on{color:var(--ok)}
.btn{border:1px solid var(--line2);border-radius:7px;padding:5px 11px;font-size:12.5px;color:var(--fg2)}
.btn:hover{background:var(--win2);color:var(--fg)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{opacity:.9;color:#fff}
.sec{padding:14px 16px 3px;font-size:10px;letter-spacing:.14em;color:var(--fg3);text-transform:uppercase}

/* ══════════ 变体 A：三栏工作台 ══════════ */
.A{display:flex;width:100%}
.A .nav{width:112px;background:var(--side);border-right:1px solid var(--line);padding:10px 0;flex:none}
.A .nav a{display:flex;align-items:center;gap:9px;padding:8px 14px;font-size:13px;color:var(--fg2);border-left:2px solid transparent;text-decoration:none}
.A .nav a:hover{background:var(--win2)}
.A .nav a.on{background:var(--win);border-left-color:var(--brand);color:var(--fg);font-weight:600}
.A .nav .ico{flex:1;display:inline-flex;align-items:center;gap:9px}
.A .nav .ico svg{width:15px;height:15px;display:block;flex:none}
.A .nav a.day{justify-content:space-between}
.A .nav a.day .n{font-family:var(--mono);font-size:10.5px;color:var(--fg3)}
.A .nav a.day.on .n{color:var(--fg2)}
.A .list{width:330px;border-right:1px solid var(--line);overflow-y:auto;flex:none;background:var(--win)}
.A .list .row{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.A .list .row:hover{background:var(--win2)}
.A .list .row.on{background:color-mix(in srgb,var(--brand) 9%,var(--win));box-shadow:inset 3px 0 0 var(--brand)}
.A .list .row .t{font-size:13.5px;font-weight:600;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.A .list .row .m{display:flex;gap:8px;align-items:center;margin-top:5px;flex-wrap:wrap}
.A .read{flex:1;overflow-y:auto;padding:26px 34px 60px;background:var(--win)}
.A .read h2{font-size:21px;line-height:1.4;margin:4px 0 6px}
.A .read .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-bottom:13px;border-bottom:1px solid var(--line);margin-bottom:16px}
.A .read .sum{background:var(--win2);border-left:3px solid var(--brand);padding:11px 15px;border-radius:0 8px 8px 0;font-size:14px;margin:0 0 18px}
.A .read .txt{font-size:14px;line-height:1.85;color:var(--fg2);white-space:pre-line}
.A .read .acts{display:flex;gap:8px;margin-top:22px;padding-top:15px;border-top:1px solid var(--line)}

/* ══════════ 变体 B：图标侧栏 + 卡片流 ══════════ */
.B{display:flex;width:100%}
.B .rail{width:56px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:6px;flex:none}
.B .rail a{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--fg2);text-decoration:none}
.B .rail a svg{width:20px;height:20px;display:block}
.B .rail a:hover{background:var(--win2)}
.B .rail a.on{background:var(--brand);color:#fff}
.B .rail .sp{flex:1}
.B .main{flex:1;overflow-y:auto;padding:0 0 40px}
.B .topbar{position:sticky;top:0;background:color-mix(in srgb,var(--win) 92%,transparent);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:14px 26px;display:flex;align-items:center;gap:12px;z-index:5}
.B .topbar h1{font-size:16px;margin:0;font-weight:700}
.B .topbar .sp{flex:1}
.B .search{border:1px solid var(--line2);border-radius:8px;padding:5px 12px;font-size:12.5px;background:var(--win2);color:var(--fg);width:200px}
.B .wrap{padding:20px 26px}
.B .hero{background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 12%,var(--win)),color-mix(in srgb,var(--brand2) 10%,var(--win)));
  border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin-bottom:18px}
.B .hero h2{margin:8px 0 6px;font-size:23px;line-height:1.35}
.B .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:14px}
.B .card{background:var(--win2);border:1px solid var(--line);border-radius:12px;padding:15px 16px;cursor:pointer}
.B .card:hover{border-color:var(--line2);transform:translateY(-1px)}
.B .card h3{margin:7px 0 5px;font-size:14px;line-height:1.45;font-weight:650}
.B .card p{margin:0;font-size:12.5px;color:var(--fg2);line-height:1.6}

/* ══════════ 变体 C：报纸（现有版式的桌面化）══════════ */
.C{width:100%;overflow-y:auto}
.C .sheet{max-width:860px;margin:0 auto;padding:22px 34px 60px}
.C .mast{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:3px double var(--line2);padding-bottom:9px}
.C .mast h1{font-family:var(--serif);font-size:30px;margin:0;letter-spacing:.04em}
.C .mast .d{font-size:12px;color:var(--fg2);padding-bottom:3px}
.C .lead{padding:20px 0;border-bottom:1px solid var(--line)}
.C .lead h2{font-family:var(--serif);font-size:26px;line-height:1.34;margin:7px 0}
.C .tri{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.C .tri article{padding:16px 18px 18px 0;border-right:1px solid var(--line)}
.C .tri article:last-child{border-right:0}
.C .tri article:not(:first-child){padding-left:18px}
.C .tri h3{font-family:var(--serif);font-size:16px;line-height:1.4;margin:5px 0 4px}
.C .tri p{margin:0;font-size:12.5px;color:var(--fg2)}
.C .more{padding:16px 0}
.C .more .h{font-size:11px;letter-spacing:.14em;color:var(--fg3);text-transform:uppercase;border-bottom:1px solid var(--line);padding-bottom:5px;margin-bottom:9px}
.C .more .cols{column-count:2;column-gap:32px}
.C .more .r{padding:7px 0;border-bottom:1px dotted var(--line);display:flex;gap:9px;align-items:baseline;break-inside:avoid}
.C .more .r .t{flex:1;font-size:13px}

/* ══════════ 设置页（三个变体共用，只是换外壳）══════════ */
.set{padding:26px 32px 60px;overflow-y:auto;width:100%}
.set h1{font-size:19px;margin:0 0 4px}
.set .sub{color:var(--fg3);font-size:12.5px;margin-bottom:22px}
.set .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px;max-width:960px}
.card2{background:var(--win2);border:1px solid var(--line);border-radius:12px;padding:17px 19px}
.card2 h3{margin:0 0 3px;font-size:14px}
.card2 .hint{font-size:12px;color:var(--fg3);margin:0 0 14px;line-height:1.6}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:13px}
.field label{font-size:12px;color:var(--fg2);font-weight:600}
.field input,.field select{background:var(--win);border:1px solid var(--line2);border-radius:8px;padding:7px 11px;font-size:13px;color:var(--fg)}
.field .note{font-size:11px;color:var(--fg3)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px dotted var(--line)}
.switch:last-child{border-bottom:0}
.switch .l{font-size:13px}
.switch .l small{display:block;color:var(--fg3);font-size:11.5px;margin-top:2px;line-height:1.5}
.toggle{width:44px;height:24px;border-radius:20px;background:var(--line2);position:relative;flex:none;transition:.16s}
.toggle.on{background:var(--ok)}
.toggle i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.16s}
.toggle.on i{left:23px}
.stat{display:flex;align-items:baseline;gap:9px;padding:8px 0;border-bottom:1px dotted var(--line)}
.stat:last-child{border-bottom:0}
.stat .v{font-family:var(--mono);font-size:16px;font-weight:700}
.stat .l{font-size:12.5px;color:var(--fg2)}
.stat .h{font-size:11.5px;color:var(--fg3);margin-left:auto}
.bar{height:7px;border-radius:5px;background:var(--line2);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:var(--brand);width:24%}
table.srcs{width:100%;border-collapse:collapse;font-size:12.5px}
table.srcs th{text-align:left;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg3);padding:5px 7px;border-bottom:1px solid var(--line2)}
table.srcs td{padding:7px;border-bottom:1px solid var(--line)}
table.srcs .num{font-family:var(--mono);text-align:right}
.mini{font-size:11px;color:var(--fg3);font-family:var(--mono)}

/* ── 切换栏 ── */
.sw{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:3px;
  background:#111;color:#fff;border-radius:999px;padding:5px 6px;box-shadow:0 10px 34px rgba(0,0,0,.4);z-index:99}
html[data-theme=dark] .sw{background:#f4f4f2;color:#111}
.sw button{width:32px;height:32px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:15px;opacity:.75}
.sw button:hover{opacity:1;background:rgba(128,128,128,.28)}
.sw .lbl{font-size:12.5px;padding:0 10px;min-width:230px;text-align:center}
.sw .lbl small{display:block;font-size:9.5px;opacity:.55;letter-spacing:.05em}
.sw .vsep{width:1px;height:20px;background:rgba(128,128,128,.4);margin:0 4px}
</style>
</head>
<body>
<div id="app"></div>

<div class="sw">
  <button id="prev" title="上一个方向（←）">‹</button>
  <div class="lbl"><span id="lbl"></span><small>PROTOTYPE · 假数据 · ← → 切换方向</small></div>
  <button id="next" title="下一个方向（→）">›</button>
  <div class="vsep"></div>
  <button id="toSettings" title="切换到设置页">⚙</button>
  <button id="toToday" title="切换回主界面">📰</button>
  <button id="theme" title="明暗主题">◐</button>
</div>

<script>
/* ───────── 图标：线性 SVG，不用 emoji ───────── */
const SVG = (p) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ICON = {
  today:  SVG('<path d="M3 10.6 12 3.2l9 7.4"/><path d="M5.2 9.4V20a1 1 0 0 0 1 1h11.6a1 1 0 0 0 1-1V9.4"/><path d="M9.6 21v-6.2h4.8V21"/>'),

  search: SVG('<circle cx="11" cy="11" r="7.2"/><path d="m20.6 20.6-4.1-4.1"/>'),
  gear:   SVG('<path d="M4 7h10M18 7h2M4 12h4M12 12h8M4 17h8M16 17h4"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="12" r="2.2"/><circle cx="14" cy="17" r="2.2"/>'),
  folder: SVG('<path d="M3.4 6.6a2 2 0 0 1 2-2h3.4l2 2.4h7.8a2 2 0 0 1 2 2v8.4a2 2 0 0 1-2 2H5.4a2 2 0 0 1-2-2z"/>'),
};

/* ───────── 假数据 ───────── */
const ITEMS = [
  {id:1,src:'游民星空',dom:'game',zh:'Xbox裁员268人，Halo、Rare等工作室划归动视',en:'Xbox lays off 268 employees as Halo, Rare move to Activision',sum:'微软重组Xbox工作室架构并裁员268人，Halo新作转交动视，黑曜石划归贝塞斯达。',t:'23:15',heat:9.0,ext:true,body:'微软今日宣布对 Xbox 部门进行第二轮重组……（本地正文 1,842 字，离线可读）'},
  {id:2,src:'3DM',dom:'game',zh:'《暗黑破坏神5》取消安全城镇，改为随车队移动',en:'',sum:'暴雪确认新作将移除系列沿用多年的安全城镇设计，改为随车队迁徙的动态据点。',t:'23:16',heat:8.0,ext:false,body:'据外媒报道……'},
  {id:3,src:'Eurogamer',dom:'game',zh:'Xbox重组引发游戏社区不满',en:'Community reaction: Xbox restructuring',sum:'第二轮裁员波及 Ninja Theory、Halo Studios 与 World\u2019s Edge，社区反应强烈。',t:'22:44',heat:8.0,ext:true,body:'The reaction has been……'},
  {id:4,src:'量子位',dom:'ai',zh:'阿里研究员透露 Qwen4.5 后将扩展至 5-10T 参数',en:'',sum:'在一次公开分享中，阿里研究员提到下一代模型的参数规模将再上一个量级。',t:'11:48',heat:7.5,ext:false,body:'在近日的一场分享中……'},

const SOURCES = [
  {name:'游民星空',dom:'game',on:true,n:68,ok:'2 分钟前'},
  {name:'机核',dom:'game',on:true,n:22,ok:'2 分钟前'},
  {name:'3DM',dom:'game',on:true,n:31,ok:'2 分钟前'},
  {name:'Gematsu',dom:'game',on:true,n:22,ok:'3 分钟前'},

  {name:'Hacker News',dom:'ai',on:true,n:34,ok:'4 分钟前'},
  {name:'机器之心',dom:'ai',on:false,n:0,ok:'需要 RSSHub'},
];

const state = {
  variant:(new URLSearchParams(location.search).get('variant')||'A').toUpperCase(),
  view:new URLSearchParams(location.search).get('view')||'today',
  domain:'all', theme:'light', selected:1, llm:false,
};
// 相对时间：新闻里「2 小时前」比「23:15」自然，也不会在卡片右侧排成机械的一列
const AGO = {1:'2 小时前',2:'2 小时前',3:'3 小时前',4:'12 小时前',5:'16 小时前',6:'8 小时前',7:'3 小时前',8:'8 小时前'};
const NAMES = {A:'三栏工作台',B:'图标侧栏 + 卡片流',C:'报纸版式（现有）'};
if(!NAMES[state.variant]) state.variant='A';

const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pool = () => ITEMS.filter(i => state.domain==='all' || i.dom===state.domain);
const sc = n => n>=8?'hi':n>=6?'mid':'lo';

/* ───────── 设置页（三方向共用） ───────── */
function settings(){
  return `
  <div class="set">
    <h1>设置</h1>
    <div class="sub">按你的选择：Key 存 Windows 凭据管理器，不落明文文件；LLM 开关就在第一屏。</div>
    <div class="grid2">

      <div class="card2">
        <h3>AI 摘要（LLM）</h3>
        <p class="hint">关着的时候：外网条目显示英文原标题、排序用规则分、同一件事可能重复出现。<b>自动流程永远不会花钱</b>，只有你点「立即生成」才会调用。</p>
        <div class="switch">
          <div class="l">启用 LLM 翻译与热度
            <small>${state.llm?'当前：开启（会消耗 token）':'当前：关闭（零 API 调用）'}</small></div>
          <div class="toggle ${state.llm?'on':''}" data-toggle="llm"><i></i></div>
        </div>
        <div class="switch">
          <div class="l">定时任务里也自动跑
            <small>关掉的话，早上 7 点那次不会带 LLM 这一步</small></div>
          <div class="toggle ${state.llm?'on':''}" data-toggle="auto"><i></i></div>
        </div>

/* ───────── 组装 ───────── */
function render(){
  const isSet = state.view==='settings';
  const html = isSet ? settings() : (state.variant==='A'?viewA():state.variant==='B'?viewB():viewC());
  document.getElementById('app').innerHTML = `
    <div class="win">
      <div class="titlebar">
        <div class="lights"><i></i><i></i><i></i></div>
        <div class="t">每日简报${isSet?' · 设置':''}</div>
        <div class="sp"></div>
        <div class="hint">${isSet?'':'双击条目打开原文 · '}${state.llm?'LLM 已开启':'LLM 已关闭'}</div>
      </div>
      <div class="body">${html}</div>
    </div>`;
  document.documentElement.dataset.theme = state.theme;
  document.getElementById('lbl').textContent = `${state.variant} — ${NAMES[state.variant]}`;
  const u = new URL(location.href);
  u.searchParams.set('variant', state.variant);
  if(isSet) u.searchParams.set('view','settings'); else u.searchParams.delete('view');
  history.replaceState(null,'',u);
}

document.addEventListener('click', e => {
  const t = e.target;
  if(t.closest('[data-toggle]')){ state.llm = !state.llm; render(); return; }
  if(t.closest('[data-view="settings"]')){ state.view='settings'; render(); return; }
  const dom = t.closest('[data-dom]');
  if(dom){ state.domain = dom.dataset.dom; render(); return; }
  const item = t.closest('[data-item]');
  if(item){ state.selected = +item.dataset.item; render(); return; }
});
function cycle(s){
  const k = Object.keys(NAMES), i = k.indexOf(state.variant);
  state.variant = k[(i+s+k.length)%k.length]; state.view='today'; render();
}
document.getElementById('prev').onclick = () => cycle(-1);
document.getElementById('next').onclick = () => cycle(1);
document.getElementById('toSettings').onclick = () => { state.view='settings'; render(); };
document.getElementById('toToday').onclick = () => { state.view='today'; render(); };
document.getElementById('theme').onclick = () => { state.theme = state.theme==='light'?'dark':'light'; render(); };
document.addEventListener('keydown', e => {
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) return;
  if(e.key==='ArrowLeft') cycle(-1);
  if(e.key==='ArrowRight') cycle(1);
});
render();
</script>
